services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    networks:
      - turret-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./server/app.py:/app/app.py:ro
      - ./server/requirements.txt:/app/requirements.txt:ro
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SERIAL_PORT=/dev/ttyUSB0
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyAMA0:/dev/ttyAMA0"
    privileged: true
    depends_on:
      - frontend
    networks:
      - turret-network

networks:
  turret-network:
    driver: bridge
